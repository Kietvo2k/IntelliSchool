name: smartclass-platform

# Ngân sách cứng của cả stack: 1.00 CPU + 1800 MiB RAM.
# Ổ đĩa dùng named volume; hạn mức file của app là 6 GiB (chừa chỗ Postgres ~2 GiB trong trần 8 GiB).

services:
  postgres:
    image: postgres:16-alpine
    cpus: "0.30"
    mem_limit: 420m
    memswap_limit: 420m
    pids_limit: 64
    shm_size: 64mb
    environment:
      POSTGRES_DB: smartclass
      POSTGRES_USER: smartclass
      POSTGRES_PASSWORD: smartclass_local_only
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=40
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=64MB
      - -c
      - min_wal_size=32MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - autovacuum_max_workers=1
      - -c
      - log_statement=none
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclass -d smartclass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: "0.70"
    mem_limit: 1380m
    memswap_limit: 1380m
    pids_limit: 256
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      COOKIE_SECURE: "false"
      RATE_LIMIT_MAX: "400"
      PG_POOL_MAX: "3"
      APP_BASE_URL: http://127.0.0.1:8080
      ALLOWED_WEB_ORIGINS: http://127.0.0.1:8080,http://127.0.0.1:5176,http://localhost:8080,http://localhost:5176
      WEB_DIST_DIR: /app/apps/web/dist
      LOCAL_STORAGE_DIR: /data/files
      MAIL_DIR: /data/mail
      FILE_QUOTA_BYTES: "6442450944"
      SEED_ON_EMPTY: "true"
      DATABASE_BACKEND: local
      PUBLIC_DATABASE_URL: postgres://smartpath_public:smartpath_public_local_only@postgres:5432/smartclass
      API_DATABASE_URL: postgres://smartpath_api:smartpath_api_local_only@postgres:5432/smartclass
      PLATFORM_CONTROL_DATABASE_URL: postgres://smartpath_control:smartpath_control_local_only@postgres:5432/smartclass
      SMTP_HOST: ""
      MINIO_ENDPOINT: ""
      MINIO_ACCESS_KEY: ""
      MINIO_SECRET_KEY: ""
      CLAMAV_HOST: ""
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "8080:8080"
      - "5176:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
